<div id="stats-metrics" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4" {% if hx_oob %}hx-swap-oob="true"{% endif %}>
    <!-- Total Population (Active + Exon) -->
    <div class="bg-white rounded-[2rem] p-6 shadow-premium border border-slate-100 relative overflow-hidden group">
        <div class="h-10 w-10 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center mb-4">
            <i class="bi bi-people-fill text-lg"></i>
        </div>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Padrón Esperado</p>
        <h3 class="text-3xl font-black text-slate-900 leading-none">{{ stats.total|default:"0" }}</h3>
    </div>

    <!-- Physical Presence (Confirmed) -->
    <div class="bg-white rounded-[2rem] p-6 shadow-premium border border-slate-100 relative overflow-hidden group">
        <div class="h-10 w-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mb-4">
            <i class="bi bi-person-check-fill text-lg"></i>
        </div>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Asistieron</p>
        <h3 class="text-3xl font-black text-emerald-600 leading-none">{{ stats.confirmadas|default:"0" }}</h3>
    </div>

    <!-- Justified Absences -->
    <div class="bg-white rounded-[2rem] p-6 shadow-premium border border-slate-100 relative overflow-hidden group border-l-4 border-l-indigo-500">
        <div class="h-10 w-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mb-4">
            <i class="bi bi-file-earmark-text-fill text-lg"></i>
        </div>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Justificadas</p>
        <h3 class="text-3xl font-black text-indigo-600 leading-none">{{ stats.justificadas|default:"0" }}</h3>
    </div>

    <!-- Unjustified Absences -->
    <div class="bg-white rounded-[2rem] p-6 shadow-premium border border-slate-100 relative overflow-hidden group">
        <div class="h-10 w-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center mb-4">
            <i class="bi bi-x-circle-fill text-lg"></i>
        </div>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Faltas Reales</p>
        <h3 class="text-3xl font-black text-red-600 leading-none">{{ stats.inasistencias|default:"0" }}</h3>
    </div>

    <!-- Unconfirmed Presence -->
    <div class="bg-white rounded-[2rem] p-6 shadow-premium border border-slate-100 relative overflow-hidden group">
        <div class="h-10 w-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center mb-4">
            <i class="bi bi-clock-fill text-lg"></i>
        </div>
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Pendientes</p>
        <h3 class="text-3xl font-black text-amber-600 leading-none">{{ stats.pendientes|default:"0" }}</h3>
    </div>
</div>
