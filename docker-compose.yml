services:
  web:
    build: .
    command: /bin/sh /app/scripts/start-web.sh
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../public_html/static:/app/staticfiles
      - ../private/media:/app/media
    env_file:
      - ../private/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../private/.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
