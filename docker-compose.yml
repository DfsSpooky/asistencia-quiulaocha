services:
  web:
    build: .
    command: /bin/sh /app/scripts/start-web.sh
    ports:
      # Solo accesible desde localhost del servidor (Nginx/Hestia hace de reverse proxy).
      - "127.0.0.1:${APP_PORT:-8020}:${APP_PORT:-8020}"
    volumes:
      - ../public_html/static:/app/staticfiles
      - ../private/media:/app/media
    env_file:
      - ../private/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; port = os.environ.get('APP_PORT', '8020'); req = urllib.request.Request(f'http://127.0.0.1:{port}/healthz/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../private/.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
